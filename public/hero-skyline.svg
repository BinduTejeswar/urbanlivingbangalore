    <rect x="95"   y="290" width="70"  height="190" fill="#1597A1" opacity="0.08"/>
    <rect x="170"  y="360" width="110" height="120" fill="#C2410C" opacity="0.07"/>
    <rect x="285"  y="250" width="80"  height="230" fill="#1597A1" opacity="0.10"/>
    <rect x="370"  y="310" width="60"  height="170" fill="#C2410C" opacity="0.09"/>
    <rect x="435"  y="270" width="100" height="210" fill="#1597A1" opacity="0.07"/>
    <rect x="540"  y="345" width="75"  height="135" fill="#C2410C" opacity="0.10"/>
    <rect x="620"  y="230" width="90"  height="250" fill="#1597A1" opacity="0.09"/>
    <rect x="715"  y="300" width="65"  height="180" fill="#C2410C" opacity="0.08"/>
    <rect x="785"  y="260" width="110" height="220" fill="#1597A1" opacity="0.10"/>
    <rect x="900"  y="340" width="80"  height="140" fill="#C2410C" opacity="0.09"/>
