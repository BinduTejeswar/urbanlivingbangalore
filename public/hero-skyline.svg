<svg width="1600" height="480" viewBox="0 0 1600 480" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="fadeTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3ECE3" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#F3ECE3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeBottom" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#F3ECE3" stop-opacity="1"/>
      <stop offset="0.4" stop-color="#F3ECE3" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- soft atmospheric blooms -->
  <circle cx="220" cy="140" r="260" fill="#D4A373" opacity="0.14"/>
  <circle cx="1330" cy="200" r="300" fill="#1597A1" opacity="0.10"/>
  <circle cx="800" cy="80" r="220" fill="#C2410C" opacity="0.06"/>

